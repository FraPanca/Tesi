name: CD

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    # Runner nativo arm64: il target di deploy è un Raspberry Pi 5 (aarch64).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      matrix:
        service: ['backend', 'frontend', 'prophet']
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Normalizza owner in minuscolo
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Contesto = ./<service>, NON la root del repo: a differenza di un monorepo con npm workspaces, qui ogni Dockerfile
      # fa COPY package*.json ./ assumendo che il contesto sia la propria cartella (stessa convenzione di docker-compose.yml).
      - name: Build immagine ${{ matrix.service }} (arm64 nativo)
        run: |
          docker build \
            -t ghcr.io/${{ env.IMAGE_OWNER }}/iot-energy-${{ matrix.service }}:${{ github.ref_name }} \
            -t ghcr.io/${{ env.IMAGE_OWNER }}/iot-energy-${{ matrix.service }}:$(git rev-parse --short HEAD) \
            ./${{ matrix.service }}

      - name: Push immagine ${{ matrix.service }}
        run: docker push --all-tags ghcr.io/${{ env.IMAGE_OWNER }}/iot-energy-${{ matrix.service }}